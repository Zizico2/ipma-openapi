[package]
name = "ipma-open-data-client"
description = "Progenitor-generated HTTP client for IPMA open-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
progenitor-client = "=0.16.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
bytes = "1"
futures-core = "0.3"
regress = "0.10"

[dev-dependencies]
futures-util = "0.3"
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time"] }
axum = "0.8"

[lints.rust]
unsafe_code = "forbid"
