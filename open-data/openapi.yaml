    WindCodeResponse:
      type: object
      properties:
        owner:
          type: string
          description: Source attribution.
          nullable: true
        country:
          type: string
          description: Source country code.
          nullable: true
        dataUpdate:
          type: string
          description: Source update timestamp; UTC, often without a timezone suffix.
          nullable: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/WindCode'
      additionalProperties: {}
      required:
      - data
    PrecipitationCode:
