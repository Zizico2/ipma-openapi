    get:
      operationId: get_city_daily_forecast
      summary: Five-day daily forecast for one city
      description: Five-day daily forecast for one city
      x-evidence:
        url: https://api.ipma.pt/
        basis: published-reference
        verified: '2026-11-12'
      parameters:
      - name: globalIdLocal
        in: path
        required: true
        description: IPMA weather location ID from distrits-islands.json.
        schema:
          type: integer
          minimum: 1
          maximum: 4294967295
          example: 1110600
      responses:
        '200':
          description: Source response; see schema descriptions and captured fixtures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityDailyForecastResponse'
              examples:
                captured:
                  summary: Sample captured from IPMA on 2026-11-12; provenance is recorded in fixtures/manifest.json.
                  externalValue: fixtures/get_city_daily_forecast.json
        4XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
        5XX:
