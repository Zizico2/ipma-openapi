components:
  schemas:
    NumericValue:
      description: Raw measurement. Null, empty strings and -99 are missing-data representations; clients
        do not normalize them.
      oneOf:
      - type: number
        nullable: true
      - type: string
        pattern: ^\s*([+-]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([eE][+-]?[0-9]+)?)?\s*$
    CodeValue:
      description: Raw category code. Unknown integers and numeric strings are allowed; no closed category
        enum is inferred.
      oneOf:
      - type: integer
        nullable: true
      - type: string
        pattern: ^\s*([+-]?[0-9]+)?\s*$
    DailyForecast:
      type: object
      properties:
        latitude:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Latitude in WGS84 degrees.
        longitude:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Longitude in WGS84 degrees.
        tMin:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Daily minimum air temperature, °C.
        tMax:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Daily maximum air temperature, °C.
        precipitaProb:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Daily precipitation probability, %. The source key is precipitaProb; prose reference
            also spells probPrecipita.
        idWeatherType:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: Weather-type source code.
        classWindSpeed:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: Daily wind-speed class.
        classPrecInt:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: Precipitation intensity class.
        predWindDir:
          type: string
          description: Prevailing compass direction.
          nullable: true
        forecastDate:
          type: string
          description: Forecast civil date, YYYY-MM-DD; not a timestamp.
        globalIdLocal:
          type: integer
          description: Location identifier when supplied per row.
          minimum: 0
      additionalProperties: {}
    CityDailyForecastResponse:
      type: object
      properties:
        owner:
          type: string
          description: Source attribution.
          nullable: true
        country:
          type: string
          description: Source country code.
          nullable: true
        dataUpdate:
          type: string
          description: Source update timestamp; UTC, often without a timezone suffix.
          nullable: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/DailyForecast'
        globalIdLocal:
          type: integer
          description: Location identifier.
          minimum: 1
      additionalProperties: {}
      required:
      - data
      - globalIdLocal
    DailyForecastResponse:
      type: object
      properties:
        owner:
          type: string
          description: Source attribution.
          nullable: true
        country:
          type: string
          description: Source country code.
          nullable: true
        dataUpdate:
          type: string
          description: Source update timestamp; UTC, often without a timezone suffix.
          nullable: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/DailyForecast'
        forecastDate:
          type: string
          description: Civil date applying to rows without their own forecastDate.
      additionalProperties: {}
      required:
      - data
      - forecastDate
    Warning:
      type: object
      properties:
        idAreaAviso:
          type: string
          description: Warning-area identifier.
        awarenessTypeName:
          type: string
          description: Source phenomenon label, in Portuguese; unfamiliar values remain valid.
        awarenessLevelID:
          type: string
          description: Source severity label; currently green/yellow/orange/red. Unknown values are retained.
        text:
          type: string
          description: Source description; may be empty.
          nullable: true
        startTime:
          type: string
          description: Start instant; source timestamp string, UTC.
        endTime:
          type: string
          description: End instant; source timestamp string, UTC.
      additionalProperties: {}
      required:
      - idAreaAviso
      - awarenessTypeName
      - awarenessLevelID
      - startTime
      - endTime
    StationObservation:
      type: object
      properties:
        temperatura:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Mean air temperature over the hour, °C.
        intensidadeVento:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Wind speed, m/s.
        intensidadeVentoKM:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Wind speed, km/h.
        precAcumulada:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Accumulated precipitation during the hour, mm.
        humidade:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Hourly mean relative humidity, %.
        pressao:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Hourly mean sea-level pressure, hPa.
        radiacao:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Solar radiation, kJ/m².
        idDireccVento:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: Source wind direction code; do not treat code as degrees.
      additionalProperties: {}
      nullable: true
    ObservationsResponse:
      type: object
      description: UTC observation timestamp → station-ID string → measurement object or null. Station
        records can be null. Timestamp keys usually omit seconds and timezone suffixes.
      additionalProperties:
        type: object
        additionalProperties:
          $ref: '#/components/schemas/StationObservation'
    SeaForecast:
      type: object
      properties:
        latitude:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Latitude in WGS84 degrees.
        longitude:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Longitude in WGS84 degrees.
        globalIdLocal:
          type: integer
          description: Coastal location identifier.
          minimum: 1
        predWaveDir:
          type: string
          description: Prevailing wave direction.
          nullable: true
        wavePeriodMin:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Minimum daily swell peak period, s.
        wavePeriodMax:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Maximum daily swell peak period, s.
        waveHighMin:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Minimum daily swell height, m.
        waveHighMax:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Maximum daily swell height, m.
        totalSeaMin:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Minimum daily significant wave height, m.
        totalSeaMax:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Maximum daily significant wave height, m.
        sstMin:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Minimum daily sea-surface temperature, °C.
        sstMax:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Maximum daily sea-surface temperature, °C.
      additionalProperties: {}
      required:
      - globalIdLocal
    SeaForecastResponse:
      type: object
      properties:
        owner:
          type: string
          description: Source attribution.
          nullable: true
        country:
          type: string
          description: Source country code.
          nullable: true
        dataUpdate:
          type: string
          description: Source update timestamp; UTC, often without a timezone suffix.
          nullable: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/SeaForecast'
        forecastDate:
          type: string
          description: Forecast civil date.
      additionalProperties: {}
      required:
      - data
      - forecastDate
    MunicipalFireRisk:
      type: object
      properties:
        latitude:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Latitude in WGS84 degrees.
        longitude:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Longitude in WGS84 degrees.
        dico:
          type: string
          description: Municipality DICO string; preserve leading zeroes. Live feed uses lowercase dico;
            the reference example uses uppercase DICO, which remains accepted and preserved as an additional
            field.
          nullable: true
        data:
          type: object
          properties:
            rcm:
              allOf:
              - $ref: '#/components/schemas/CodeValue'
              description: Municipal fire-danger class. Currently 1..5; preserve unfamiliar codes.
          additionalProperties: {}
          required:
          - rcm
      additionalProperties: {}
      required:
      - data
    FireRiskResponse:
      type: object
      properties:
        dataPrev:
          type: string
          description: Forecast civil date.
        dataRun:
          type: string
          description: Model run civil date.
        fileDate:
          type: string
          description: Source update timestamp; observed space separator, UTC.
          nullable: true
        local:
          type: object
          description: Municipality DICO → risk record. Keys are strings with leading zeroes.
          additionalProperties:
            $ref: '#/components/schemas/MunicipalFireRisk'
      additionalProperties: {}
      required:
      - dataPrev
      - dataRun
      - local
    UvForecast:
      type: object
      properties:
        globalIdLocal:
          type: integer
          description: Location identifier; zero is supplied for some unmapped locations.
          minimum: 0
        data:
          type: string
          description: Forecast civil date.
        iUv:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: UV index.
        idPeriodo:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: Source-internal period code; meaning not inferred.
        intervaloHora:
          type: string
          description: Published peak-hour interval; may be empty.
          nullable: true
      additionalProperties: {}
      required:
      - globalIdLocal
      - data
    SeismicEvent:
      type: object
      properties:
        lat:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Epicentre latitude in WGS84 degrees.
        lon:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Epicentre longitude in WGS84 degrees.
        magnitud:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Reported magnitude; -99 is nodata.
        depth:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Hypocentral depth, km.
        time:
          type: string
          description: Event timestamp, UTC.
          nullable: true
        dataUpdate:
          type: string
          description: Record update timestamp, UTC.
          nullable: true
        magType:
          type: string
          description: Raw magnitude-type token.
          nullable: true
        source:
          type: string
          description: Reporting source.
          nullable: true
        obsRegion:
          type: string
          description: Source observation-region label.
          nullable: true
        shakemapid:
          type: string
          description: Source ShakeMap ID.
          nullable: true
        shakemapref:
          type: string
          description: Source ShakeMap reference.
          nullable: true
        sismoId:
          type: string
          description: Source event identifier.
          nullable: true
        googlemapref:
          type: string
          description: Source map reference.
          nullable: true
        tensorRef:
          type: string
          description: Source tensor reference.
          nullable: true
        local:
          oneOf:
          - type: string
            nullable: true
          - type: number
          description: Locality token; preserved without coercion.
        degree:
          oneOf:
          - type: string
            nullable: true
          - type: number
          description: Reported intensity token; may be numeric, text, or null.
        sensed:
          type: boolean
          nullable: true
          description: Reported felt flag, if supplied.
      additionalProperties: {}
      required:
      - time
    SeismicResponse:
      type: object
      properties:
        owner:
          type: string
          description: Source attribution.
          nullable: true
        country:
          type: string
          description: Source country code.
          nullable: true
        dataUpdate:
          type: string
          description: Source update timestamp; UTC, often without a timezone suffix.
          nullable: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/SeismicEvent'
        idArea:
          type: integer
          description: Source region selector.
        updateDate:
          type: string
          description: Source catalogue update timestamp, UTC.
          nullable: true
        lastSismicActivityDate:
          type: string
          description: Most recent reported activity timestamp, UTC.
          nullable: true
      additionalProperties: {}
      required:
      - data
    Location:
      type: object
      properties:
        latitude:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Latitude in WGS84 degrees.
        longitude:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Longitude in WGS84 degrees.
        globalIdLocal:
          type: integer
          description: Location identifier.
          minimum: 1
        local:
          type: string
          description: Location name.
        idAreaAviso:
          type: string
          description: Warning-area identifier.
          nullable: true
        idRegiao:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: Region ID; currently 1 mainland, 2 Madeira, 3 Azores.
        idDistrito:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: District/island ID.
        idConcelho:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: Municipality component scoped by district; not a complete DICO.
        idLocal:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: Coastal location code.
      additionalProperties: {}
      required:
      - globalIdLocal
      - local
    LocationsResponse:
      type: object
      properties:
        owner:
          type: string
          description: Source attribution.
          nullable: true
        country:
          type: string
          description: Source country code.
          nullable: true
        dataUpdate:
          type: string
          description: Source update timestamp; UTC, often without a timezone suffix.
          nullable: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Location'
      additionalProperties: {}
      required:
      - data
    WeatherCode:
      type: object
      properties:
        idWeatherType:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: Source category code, including unfamiliar values and reference-table sentinels.
        descWeatherTypePT:
          type: string
          description: Portuguese description.
          nullable: true
        descWeatherTypeEN:
          type: string
          description: English description.
          nullable: true
      additionalProperties: {}
      required:
      - idWeatherType
    WeatherCodeResponse:
      type: object
      properties:
        owner:
          type: string
          description: Source attribution.
          nullable: true
        country:
          type: string
          description: Source country code.
          nullable: true
        dataUpdate:
          type: string
          description: Source update timestamp; UTC, often without a timezone suffix.
          nullable: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/WeatherCode'
