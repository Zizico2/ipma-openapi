openapi: 3.0.3
info:
  title: IPMA open-data — community-maintained upstream contract
  version: 0.1.0
  description: 'Describes source HTTP responses, not the normalized gRPC API. This specification is maintained
    independently and is not published or endorsed by IPMA. Based on the official HTML reference and captured
    responses. Missing measurements, numeric strings, JSON numbers, nulls and -99 sentinels are kept in
    their source representation. Unknown fields are permitted. Response fields are required only where
    the source reference and/or consumer invariants provide evidence. Capture fixtures do not establish
    universal guarantees. Naive timestamps are source strings interpreted as UTC by the website; no RFC3339
    timezone suffix is invented. Attribution and reuse conditions: https://api.ipma.pt/.'
  contact:
    name: IPMA source reference (upstream)
    url: https://api.ipma.pt/
servers:
- url: https://api.ipma.pt/open-data
  description: IPMA upstream directory; keep the /open-data prefix when configuring a client
externalDocs:
  url: https://api.ipma.pt/
  description: Official HTML reference
x-last-verified: '2026-11-12'
x-source-status: documented-html
