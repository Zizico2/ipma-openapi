    Geometry:
      type: object
      properties:
        type:
          type: string
          description: GeoJSON geometry type.
        coordinates:
          type: array
          items: {}
        geometries:
          type: array
          items: {}
      additionalProperties: {}
      required:
      - type
      nullable: true
    GeoFeature:
      type: object
      properties:
        type:
          type: string
          description: GeoJSON Feature.
        geometry:
          $ref: '#/components/schemas/Geometry'
        properties:
          type: object
          nullable: true
          additionalProperties: {}
          description: Source station/bivalve properties, including nested values. No sentinel normalization.
        id:
          oneOf:
          - type: string
          - type: number
      additionalProperties: {}
      required:
      - type
    GeoFeatureCollection:
      type: object
      properties:
        type:
          type: string
          description: GeoJSON FeatureCollection.
        features:
          type: array
          items:
            $ref: '#/components/schemas/GeoFeature'
      additionalProperties: {}
      required:
      - type
      - features
      description: Source metadata, CRS and foreign members are preserved through additional properties.
