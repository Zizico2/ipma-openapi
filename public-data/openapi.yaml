openapi: 3.0.3
info:
  title: IPMA public-data — community-maintained upstream contract
  version: 0.1.0
  description: 'Describes source HTTP responses, not the normalized gRPC API. This specification is maintained
    independently and is not published or endorsed by IPMA. Based on the website JavaScript and captured
    responses; covers only the verified Portugal website feeds listed here. No complete endpoint catalogue
    is claimed.
    Missing measurements, numeric strings, JSON numbers, nulls and -99 sentinels are kept in their source
    representation. Unknown fields are permitted. Response fields are required only where the source reference
    and/or consumer invariants provide evidence. Capture fixtures do not establish universal guarantees.
    Naive timestamps are source strings interpreted as UTC by the website; no RFC3339 timezone suffix
    is invented. Attribution and reuse conditions: https://api.ipma.pt/.'
  contact:
    name: IPMA source reference (upstream)
    url: https://api.ipma.pt/
servers:
- url: https://api.ipma.pt/public-data
  description: IPMA upstream directory; keep the /public-data prefix when configuring a client
externalDocs:
  url: https://www.ipma.pt/opencms/bin/scripts/otempo/prev.localidade.hora.js
  description: Website consumer JavaScript; observed behavior, not an official API contract
x-last-verified: '2026-11-15'
x-source-status: observed-website-feed
paths:
  /forecast/aggregate/{globalIdLocal}.json:
    get:
      operationId: get_forecast
      summary: Mixed hourly, three-hourly and daily forecasts
      description: Returns source rows without interpolation, sorting or filtering. To build a next-ten-hours
        view, select idPeriodo=1 and future UTC timestamps. A fixed horizon is not guaranteed. Additional
        fields and unfamiliar codes are permitted.
      x-evidence:
        url: https://www.ipma.pt/opencms/bin/scripts/otempo/prev.localidade.hora.js
        basis: observed-consumer-and-fixtures
        verified: '2026-11-12'
      parameters:
      - name: globalIdLocal
        in: path
        required: true
        description: Website location ID from forecast/locations.json.
        schema:
          type: integer
          minimum: 1
          maximum: 4294967295
          example: 1110600
      responses:
        '200':
          description: Source response; see schema descriptions and captured fixtures.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Forecast'
              examples:
                captured:
                  summary: Sample captured from IPMA on 2026-11-12; provenance is recorded in fixtures/manifest.json.
                  externalValue: fixtures/get_forecast.json
        4XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
        5XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
      x-captured-fixture: fixtures/get_forecast.json
  /forecast/locations.json:
    get:
      operationId: get_locations
      summary: Website forecast location catalogue
      description: Website forecast location catalogue
      x-evidence:
        url: https://www.ipma.pt/opencms/bin/scripts/otempo/prev.localidade.hora.js
        basis: observed-consumer-and-fixtures
        verified: '2026-11-12'
      parameters: []
      responses:
        '200':
          description: Source response; see schema descriptions and captured fixtures.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
              examples:
                captured:
                  summary: Sample captured from IPMA on 2026-11-12; provenance is recorded in fixtures/manifest.json.
                  externalValue: fixtures/get_locations.json
        4XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
        5XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
      x-captured-fixture: fixtures/get_locations.json
  /districts.json:
    get:
      operationId: get_districts
      summary: Website district/island catalogue
      description: Website district/island catalogue
      x-evidence:
        url: https://www.ipma.pt/opencms/bin/scripts/otempo/prev.localidade.hora.js
        basis: observed-consumer-and-fixtures
        verified: '2026-11-12'
      parameters: []
      responses:
        '200':
          description: Source response; see schema descriptions and captured fixtures.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/District'
              examples:
                captured:
                  summary: Sample captured from IPMA on 2026-11-12; provenance is recorded in fixtures/manifest.json.
                  externalValue: fixtures/get_districts.json
        4XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
        5XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
      x-captured-fixture: fixtures/get_districts.json
  /warnings/warnings_www.json:
    get:
      operationId: get_warnings
      summary: Website warnings envelope
      description: Website warnings envelope
      x-evidence:
        url: https://www.ipma.pt/opencms/bin/scripts/otempo/prev.localidade.hora.js
        basis: observed-consumer-and-fixtures
        verified: '2026-11-12'
      parameters: []
      responses:
        '200':
          description: Source response; see schema descriptions and captured fixtures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarningsResponse'
              examples:
                captured:
                  summary: Sample captured from IPMA on 2026-11-12; provenance is recorded in fixtures/manifest.json.
                  externalValue: fixtures/get_warnings.json
        4XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
        5XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
      x-captured-fixture: fixtures/get_warnings.json
  /observation/surface-stations/daily_stations/{year}/{monthDir}/obs_dia_{year}_{month}_{stationId}.json:
    get:
      operationId: get_daily_station_observations
      summary: Monthly series of daily surface-station summaries
      description: One station-month of daily summaries for the main IPMA surface stations on the mainland,
        Azores and Madeira. The directory month is zero-padded while the filename month is not, so monthDir
        and month must name the same month. Rows cover every day of the month; days not yet observed have
        null measurements. Archived months were observed from January 2019. Unpublished station-months,
        including 1200579 Lisboa listed by the website, redirect to the IPMA homepage with HTTP 302 rather
        than returning 404.
      x-evidence:
        url: https://www.ipma.pt/opencms/pt/oclima/monitoriza.dia/
        basis: observed-consumer-and-fixtures
        verified: '2026-11-15'
      parameters:
      - name: year
        in: path
        required: true
        description: Calendar year; used in the directory and filename.
        schema:
          type: integer
          minimum: 2019
          maximum: 9999
          example: 2026
      - name: monthDir
        in: path
        required: true
        description: Zero-padded month directory, 01-12.
        schema:
          type: string
          pattern: ^(0[1-9]|1[0-2])$
          example: '10'
      - name: month
        in: path
        required: true
        description: Unpadded filename month, 1-12; the same month as monthDir.
        schema:
          type: integer
          minimum: 1
          maximum: 12
          example: 10
      - name: stationId
        in: path
        required: true
        description: 'Surface station ID. The website lists 1200501, 1200511, 1200512, 1200522, 1200524,
          1200545, 1200548, 1200551, 1200554, 1200558, 1200560, 1200562, 1200567, 1200570, 1200571, 1200575,
          1200579, 1210622, 1210683, 1210702, 1210718, 1210734 and 1210770.'
        schema:
          type: integer
          minimum: 1
          maximum: 4294967295
          example: 1200545
      responses:
        '200':
          description: Source response; see schema descriptions and captured fixtures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyStationObservations'
              examples:
                captured:
                  summary: Sample captured from IPMA on 2026-11-15; provenance is recorded in fixtures/manifest.json.
                  externalValue: fixtures/get_daily_station_observations.json
        4XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
        5XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
      x-captured-fixture: fixtures/get_daily_station_observations.json
  /mf2_preview/{fireLayer}/{fireLayer}_{date}T00_00_00.png:
    get:
      operationId: get_fire_danger_map
      summary: Daily LSA SAF fire-danger map frame for mainland Portugal
      description: 'Transparent PNG overlay for the website fire-danger map. The image covers latitude
        35.9077838 to 43.9007122 and longitude -12.8000047 to -1.2014967 (WGS84 bounds used by the website).
        Layers: lsasaf_fwi_continent Fire Weather Index; lsasaf_isi_continent Initial Spread Index; lsasaf_bui_continent
        Buildup Index; lsasaf_ffmc_continent Fine Fuel Moisture Code; lsasaf_p2000_continent probability
        that a detected fire reaches 2000 GJ of released energy; lsasaf_risk_continent Fire Risk Map classes.
        Values are colour classes; the legends live on the website page. Frames were observed from the previous
        UTC day through about five days ahead; older and later dates redirect to the IPMA homepage with HTTP
        302. The website also references lsasaf_fwi_prc_continent, but no frame was published for any probed
        date.'
      x-evidence:
        url: https://www.ipma.pt/opencms/pt/riscoincendio/fwi/
        basis: observed-consumer-and-fixtures
        verified: '2026-11-15'
      parameters:
      - name: fireLayer
        in: path
        required: true
        description: Fire-danger layer name; used in the directory and filename.
        schema:
          type: string
          enum:
          - lsasaf_fwi_continent
          - lsasaf_isi_continent
          - lsasaf_bui_continent
          - lsasaf_ffmc_continent
          - lsasaf_p2000_continent
          - lsasaf_risk_continent
          example: lsasaf_fwi_continent
      - name: date
        in: path
        required: true
        description: UTC forecast day, YYYY-MM-DD. The website formats this name in browser-local time,
          which matched UTC for the November 2026 captures; daylight-saving naming is unverified.
        schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          example: '2026-11-15'
        x-probe-current-utc: '%Y-%m-%d'
      responses:
        '200':
          description: Source response; see schema descriptions and captured fixtures.
          content:
            image/png:
              schema:
                type: string
                format: binary
        4XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
        5XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
      x-captured-fixture: fixtures/get_fire_danger_map.png
  /mf2_preview/{modelLayer}/{modelLayer}_{time}.png:
    get:
      operationId: get_model_map
      summary: Hourly ECMWF model map frame for Portugal and the Atlantic
      description: 'Transparent PNG overlay for the website numerical-forecast map. The image covers latitude
        27.9624 to 46.75 and longitude -37.05 to 0.0802303 (WGS84 bounds used by the website), including
        mainland Portugal, the Azores and Madeira. Layers: ecmwf_2t_atlantic 2 m temperature; ecmwf_mslp_atlantic
        mean sea-level pressure; ecmwf_pcp_atlantic precipitation; ecmwf_10windintensity_atlantic 10 m
        wind speed. Values are colour classes; the legends live on the website page. Frames were observed
        hourly from 00:00 UTC on the previous day to about 48 hours ahead; other hours redirect to the
        IPMA homepage with HTTP 302.'
      x-evidence:
        url: https://www.ipma.pt/opencms/pt/otempo/prev.numerica/index-mf2.jsp
        basis: observed-consumer-and-fixtures
        verified: '2026-11-15'
      parameters:
      - name: modelLayer
        in: path
        required: true
        description: Model layer name; used in the directory and filename.
        schema:
          type: string
          enum:
          - ecmwf_2t_atlantic
          - ecmwf_mslp_atlantic
          - ecmwf_pcp_atlantic
          - ecmwf_10windintensity_atlantic
          example: ecmwf_pcp_atlantic
      - name: time
        in: path
        required: true
        description: UTC valid hour, YYYY-MM-DDTHH_00_00. The website formats this name in browser-local
          time, which matched UTC for the November 2026 captures; daylight-saving naming is unverified.
        schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}_00_00$
          example: 2026-11-15T19_00_00
        x-probe-current-utc: '%Y-%m-%dT%H_00_00'
      responses:
        '200':
          description: Source response; see schema descriptions and captured fixtures.
          content:
            image/png:
              schema:
                type: string
                format: binary
        4XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
        5XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
      x-captured-fixture: fixtures/get_model_map.png
  /mf2_preview/Tracers/{time}.json:
    get:
      operationId: get_model_wind_field
      summary: Hourly ECMWF 10 m wind vector grid for Portugal and the Atlantic
      description: Wind field animated as particles on the website numerical-forecast map. The array holds
        two grid components with identical headers; the website reads the first as the eastward (u) and
        the second as the northward (v) component, in m/s. Each data array is row-major, starting at la1/lo1
        (north-west) and stepping east by dx and south by dy. Frame availability matches get_model_map;
        other hours redirect to the IPMA homepage with HTTP 302.
      x-evidence:
        url: https://www.ipma.pt/opencms/pt/otempo/prev.numerica/index-mf2.jsp
        basis: observed-consumer-and-fixtures
        verified: '2026-11-15'
      parameters:
      - name: time
        in: path
        required: true
        description: UTC valid hour, YYYY-MM-DDTHH_00_00. The website formats this name in browser-local
          time, which matched UTC for the November 2026 captures; daylight-saving naming is unverified.
        schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}_00_00$
          example: 2026-11-15T19_00_00
        x-probe-current-utc: '%Y-%m-%dT%H_00_00'
      responses:
        '200':
          description: Source response; see schema descriptions and captured fixtures.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WindGridComponent'
              examples:
                captured:
                  summary: Sample captured from IPMA on 2026-11-15; provenance is recorded in fixtures/manifest.json.
                  externalValue: fixtures/get_model_wind_field.json
        4XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
        5XX:
          description: Non-success upstream response. The body format is not specified; it may be HTML
            or plain text.
      x-captured-fixture: fixtures/get_model_wind_field.json
components:
  schemas:
    NumericValue:
      description: Raw measurement. Null, empty strings and -99 are missing-data representations; clients
        do not normalize them.
      oneOf:
      - type: number
        nullable: true
      - type: string
        pattern: ^\s*([+-]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([eE][+-]?[0-9]+)?)?\s*$
    CodeValue:
      description: Raw category code. Unknown integers and numeric strings are allowed; no closed category
        enum is inferred.
      oneOf:
      - type: integer
        nullable: true
      - type: string
        pattern: ^\s*([+-]?[0-9]+)?\s*$
    Forecast:
      type: object
      properties:
        globalIdLocal:
          type: integer
          description: Source location ID.
          minimum: 1
        dataPrev:
          type: string
          description: Forecast timestamp, UTC. Daily rows also use this field.
        dataUpdate:
          type: string
          description: Source row update timestamp, UTC.
          nullable: true
        idPeriodo:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: Observed 1=hourly, 3=three-hourly, 24=daily. Unknown codes remain valid; coverage
            is not fixed.
        ddVento:
          type: string
          description: Wind direction source token.
          nullable: true
        dirOndulacao:
          type: string
          description: Wave direction source token.
          nullable: true
        tMed:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Air temperature, °C.
        tMin:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Daily minimum temperature, °C; generally daily rows.
        tMax:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Daily maximum temperature, °C; generally daily rows.
        hR:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Relative humidity, %.
        ffVento:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Wind speed at 10m, km/h.
        utci:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Source UTCI value, °C; retained as its named index.
        probabilidadePrecipita:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Website describes probability of >=0.3 mm precipitation during the preceding three
            hours. Do not reinterpret as a one-hour probability.
        iUv:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: UV index; generally daily rows.
        tempAguaMar:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Sea-water temperature, °C.
        marTotal:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Total significant sea-wave height, m.
        ondulacao:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Swell height, m.
        periodOndulacao:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Swell period, s.
        periodoPico:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Peak period, s.
        idTipoTempo:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: Weather-type source code.
        idIntensidadePrecipita:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: Precipitation intensity source code.
        idFfxVento:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: Daily wind-speed source class.
      additionalProperties: {}
      required:
      - globalIdLocal
      - dataPrev
    Location:
      type: object
      properties:
        globalIdLocal:
          type: integer
          description: Website location ID.
          minimum: 1
        local:
          type: string
          description: Location name.
        latitude:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: WGS84 latitude, degrees.
        longitude:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: WGS84 longitude, degrees.
        idAreaAviso:
          type: string
          description: Warning-area identifier.
          nullable: true
        idRegiao:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: Region ID.
        idDistrito:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: District/island ID.
        idConcelho:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: District-scoped municipality component.
      additionalProperties: {}
      required:
      - globalIdLocal
      - local
    District:
      type: object
      properties:
        idDistrito:
          type: integer
          description: District/island identifier.
          minimum: 1
        idRegiao:
          allOf:
          - $ref: '#/components/schemas/CodeValue'
          description: Region identifier.
        nome:
          type: string
          description: District/island name.
      additionalProperties: {}
      required:
      - idDistrito
      - nome
    Warning:
      type: object
      properties:
        idAreaAviso:
          type: string
          description: Warning-area identifier.
        awarenessTypeName:
          type: string
          description: Source phenomenon label, in Portuguese; unfamiliar values remain valid.
        awarenessLevelID:
          type: string
          description: Source severity label; currently green/yellow/orange/red. Unknown values are retained.
        text:
          type: string
          description: Source description; may be empty.
          nullable: true
        startTime:
          type: string
          description: Start instant; source timestamp string, UTC.
        endTime:
          type: string
          description: End instant; source timestamp string, UTC.
        reportDate:
          type: string
          description: Report timestamp, UTC.
          nullable: true
      additionalProperties: {}
      required:
      - idAreaAviso
      - awarenessTypeName
      - awarenessLevelID
      - startTime
      - endTime
    WarningsResponse:
      type: object
      properties:
        owner:
          type: string
          description: Source attribution.
          nullable: true
        country:
          type: string
          description: Country code.
          nullable: true
        dataAtualiza:
          type: string
          description: Source update timestamp, UTC; fractional seconds are observed.
          nullable: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
      additionalProperties: {}
      required:
      - data
    DailyStationObservations:
      type: object
      properties:
        station_id:
          type: string
          description: Surface station ID as a decimal string.
        station_name:
          type: string
          description: Station name; the website strips a trailing " (IPMA)" for display.
        latitude:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: WGS84 latitude, degrees.
        longitude:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: WGS84 longitude, degrees.
        height:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Station elevation, m.
        data:
          type: array
          items:
            $ref: '#/components/schemas/DailyStationObservation'
      additionalProperties: {}
      required:
      - station_id
      - data
    DailyStationObservation:
      type: object
      properties:
        datetime:
          type: string
          description: Observation day as a UTC midnight timestamp with a Z suffix and milliseconds.
        Tar_med:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Daily mean air temperature, °C.
        Tar_max:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Daily maximum air temperature, °C.
        Tar_min:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Daily minimum air temperature, °C.
        RRR_qt:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Daily accumulated precipitation, mm.
        HR_med:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Daily mean relative humidity, %. Unit not labelled by the website; inferred from
            observed values.
        Pr_Nm_med:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Daily mean sea-level pressure, hPa. Unit not labelled by the website; inferred from
            observed values.
        ff_med:
          allOf:
          - $ref: '#/components/schemas/NumericValue'
          description: Daily mean wind speed. Unit not labelled by the website; observed magnitudes are
            consistent with m/s.
      additionalProperties: {}
      required:
      - datetime
    WindGridHeader:
      type: object
      properties:
        nx:
          type: integer
          description: Grid columns (longitude steps).
          minimum: 1
        ny:
          type: integer
          description: Grid rows (latitude steps).
          minimum: 1
        numberPoints:
          type: integer
          description: Grid points; nx × ny.
          minimum: 1
        lo1:
          type: number
          description: Western longitude of the first column, degrees.
        lo2:
          type: number
          description: Eastern longitude of the last column, degrees.
        la1:
          type: number
          description: Northern latitude of the first row, degrees.
        la2:
          type: number
          description: Southern latitude of the last row, degrees.
        dx:
          type: number
          description: Longitude step, degrees.
        dy:
          type: number
          description: Latitude step, degrees.
      additionalProperties: {}
      required:
      - nx
      - ny
      - lo1
      - la1
      - dx
      - dy
    WindGridComponent:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/WindGridHeader'
        data:
          type: array
          description: Row-major component values, m/s.
          items:
            type: number
            nullable: true
      additionalProperties: {}
      required:
      - header
      - data
