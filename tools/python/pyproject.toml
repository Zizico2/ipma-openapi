[project]
name = "ipma-openapi-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml==6.0.3", "openapi-spec-validator>=0.8,<0.9", "openapi-schema-validator>=0.8,<0.9"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
