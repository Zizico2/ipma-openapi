name: Probe live IPMA contract drift
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ipma-live-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.7"
      - run: uv python install
      - name: Capture live responses and report drift
        run: uv run --locked python tools/contracts.py probe --output .artifacts/live-probe
      - name: Save reviewable samples and drift report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipma-contract-probe
          path: .artifacts/live-probe/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
