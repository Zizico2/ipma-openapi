name: Validate contracts and generated clients
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.7"
      - name: Install pinned toolchains
        working-directory: tools/python
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          uv python install
      - name: Validate specs, captures and drift detection
        working-directory: tools/python
        run: |
          uv run --locked python contracts.py validate
          uv run --locked python -m unittest discover -s . -p 'test_*.py'
          uv run --locked python reference.py --check
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Verify Rust generation tooling
        working-directory: tools/rust
        run: |
          cargo run --locked -- --check
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: Verify open-data Rust client
        working-directory: open-data/rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo test --locked --doc
      - name: Verify public-data Rust client
        working-directory: public-data/rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo test --locked --doc
